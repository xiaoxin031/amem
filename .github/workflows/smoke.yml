name: install-smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: pretend Claude Code and Codex are installed
        shell: bash
        run: mkdir -p "$HOME/.claude" "$HOME/.codex" "$RUNNER_TEMP/proj"
      - name: install (sh)
        if: runner.os != 'Windows'
        run: ./install.sh
      - name: install (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1
      - name: run the installed hooks exactly as the CLIs would
        shell: bash
        run: |
          set -euo pipefail
          proj="$RUNNER_TEMP/proj"
          cd "$proj" && git init -q && git config user.email ci@example.com && git config user.name ci
          amem="$HOME/.local/bin/amem"; [ -f "$amem.exe" ] && amem="$amem.exe"
          "$amem" add user "smoke-test-user"
          py=$(command -v python3 || command -v python)
          start=$("$py" -c "import json,os;print(json.load(open(os.path.expanduser('~/.claude/settings.json')))['hooks']['SessionStart'][0]['hooks'][0]['command'])")
          stop=$("$py" -c "import json,os;print(json.load(open(os.path.expanduser('~/.codex/hooks.json')))['hooks']['Stop'][0]['hooks'][0]['command'])")
          echo "start hook: $start"; echo "stop hook: $stop"
          payload() { printf '{"session_id":"s1","cwd":"%s","stop_hook_active":false}' "$(pwd -W 2>/dev/null || pwd)"; }
          out="$RUNNER_TEMP"
          payload | eval "$start" > "$out/start.json"; head -c 300 "$out/start.json"; echo
          grep -q smoke-test-user "$out/start.json"
          payload | eval "$stop" > "$out/stop1.json"; ! grep -q '"block"' "$out/stop1.json"
          echo hi > edited.txt
          payload | eval "$stop" > "$out/stop2.json"; cat "$out/stop2.json" | head -c 200; echo
          grep -q '"decision":"block"' "$out/stop2.json"
          grep -q 'trusted_hash' "$HOME/.codex/config.toml"
          grep -q 'mcp__amem' "$HOME/.claude/settings.json"
      - name: run the Codex SessionStart hook through cmd.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cmd = (Get-Content "$HOME/.codex/hooks.json" | ConvertFrom-Json).hooks.SessionStart[0].hooks[0].command
          Write-Host "hook: $cmd"
          $json = '{"session_id":"s2","cwd":"' + ($env:RUNNER_TEMP -replace '\\','/') + '/proj"}'
          $out = $json | cmd /c $cmd
          if (-not ("$out" -match 'smoke-test-user')) { throw "snapshot missing: $out" }
      - name: MCP server answers
        shell: bash
        run: |
          amem="$HOME/.local/bin/amem"; [ -f "$amem.exe" ] && amem="$amem.exe"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"memory_search","arguments":{"query":"smoke"}}}' | "$amem" mcp | tee mcp.out
          grep -q smoke-test-user mcp.out || grep -q '"id":2' mcp.out
      - name: uninstall
        shell: bash
        run: |
          amem="$HOME/.local/bin/amem"; [ -f "$amem.exe" ] && amem="$amem.exe"
          "$amem" uninstall
          ! grep -q amem "$HOME/.claude/settings.json"
